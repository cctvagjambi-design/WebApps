{% extends 'layout.html' %}
{% block content %}
  <h1>Register Delivery Slip</h1>
  <form method='post' class='form-layout'>
    <div class='form-group'>
      <label for='slip_number'>Slip Number</label>
      <div class='form-row'>
        <input id='slip_number' class='field-inline' type='text' name='slip_number' required />
        <button type='button' id='scan-barcode-btn' class='button-link barcode-button'>Scan Barcode</button>
      </div>
      <input id='barcode-file-input' type='file' accept='image/*' capture='environment' style='display:none;' />
      <div id='interactive' class='viewport' style='display:none;'>
        <div id='scan-area' class='scan-area'>
          Arahkan barcode di dalam kotak
        </div>
      </div>
      <div id='barcode-status' style='margin-top:0.45rem; color:#64748b; font-size:0.95rem;'></div>
    </div>
    <div class='form-group'>
      <label for='equipment'>Equipment</label>
      <input id='equipment' type='text' name='equipment' list='equipment-options' placeholder='Type or choose equipment' required autocomplete='off' />
      <datalist id='equipment-options'>
        {% for item in equipment_suggestions %}
          <option value='{{ item.equipment_number }}'>{{ item.equipment_number }} – {{ item.customer_name }}</option>
        {% endfor %}
      </datalist>
      <div style='margin-top:0.5rem;'>
        <label for='customer_name' style='display:block; font-size:0.95rem; color:#374151;'>Customer Name</label>
        <input id='customer_name' type='text' name='customer_name' readonly placeholder='Customer name will auto-fill when equipment is selected' style='width:100%;' />
      </div>
      <p style='margin: 0.35rem 0 0; color: #64748b; font-size: 0.95rem;'>Select an equipment number from the list; the customer name will be filled automatically.</p>
    </div>
    <div class='form-group'>
      <label for='delivery_date'>Delivery Date</label>
      <input id='delivery_date' type='date' name='delivery_date' required />
    </div>
    <button type='submit'>Register Slip</button>
  </form>
  <script src='https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js'></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const scanButton = document.getElementById('scan-barcode-btn');
      const slipNumberInput = document.getElementById('slip_number');
      const barcodeViewport = document.getElementById('interactive');
      const barcodeStatus = document.getElementById('barcode-status');
      const barcodeFileInput = document.getElementById('barcode-file-input');

      if (!scanButton || !slipNumberInput || !barcodeViewport || !barcodeStatus || !barcodeFileInput) {
        return;
      }

      let activeStream = null;
      let quaggaInitialized = false;

      const stopStream = function () {
        if (activeStream) {
          activeStream.getTracks().forEach(function (track) {
            track.stop();
          });
          activeStream = null;
        }
        if (quaggaInitialized) {
          Quagga.stop();
          quaggaInitialized = false;
        }
      };

      const setValueFromBarcode = function (value) {
        if (value) {
          slipNumberInput.value = value;
          barcodeStatus.textContent = 'Barcode detected and inserted into Slip Number.';
        }
      };

      const scanFromImage = function (file) {
        const imageUrl = URL.createObjectURL(file);
        Quagga.decodeSingle({
          inputStream: {
            name: 'ImageInputStream',
            type: 'ImageStream',
            path: imageUrl
          },
          decoder: {
            readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'code_39_reader', 'upc_reader', 'upc_e_reader']
          }
        }, function (result) {
          if (result && result.codeResult) {
            setValueFromBarcode(result.codeResult.code);
          } else {
            barcodeStatus.textContent = 'No barcode found in the selected image. Please try again.';
          }
          URL.revokeObjectURL(imageUrl);
        });
      };

      scanButton.addEventListener('click', function () {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          barcodeFileInput.click();
          return;
        }

        if (!window.Quagga) {
          barcodeStatus.textContent = 'QuaggaJS is not loaded. Please use the file picker or enter the slip number manually.';
          barcodeFileInput.click();
          return;
        }

        try {
          barcodeStatus.textContent = 'Opening camera...';
          barcodeViewport.style.display = 'block';

          Quagga.init({
            inputStream: {
              name: 'Live',
              type: 'LiveStream',
              target: barcodeViewport,
              constraints: {
                facingMode: 'environment',
                width: 640,
                height: 480
              }
            },
            locator: {
              patchSize: 'x-large',
              halfSample: false
            },
            numOfWorkers: 4,
            frequency: 10,
            decoder: {
              readers: [
                'code_128_reader',
                'ean_reader',
                'ean_8_reader',
                'code_39_reader',
                'code_39_vin_reader',
                'codabar_reader',
                'upc_reader',
                'upc_e_reader',
                'i2of5_reader'
              ]
            },
            locate: true
          }, function (err) {
            if (err) {
              console.error('Quagga init error:', err);
              barcodeStatus.textContent = 'Unable to initialize camera: ' + err.message + '. Please use the file picker instead.';
              barcodeViewport.style.display = 'none';
              barcodeFileInput.click();
              return;
            }

            quaggaInitialized = true;
            Quagga.start();
            barcodeStatus.textContent = 'Scanning... Point the camera at a barcode.';

            if (window.Quagga && Quagga.offProcessed) {
                Quagga.offProcessed();
              }
              if (window.Quagga && Quagga.offDetected) {
                Quagga.offDetected();
              }

              Quagga.onDetected(function (result) {
                if (result && result.codeResult) {
                  setValueFromBarcode(result.codeResult.code);
                  stopStream();
                  barcodeViewport.style.display = 'none';
                }
              });
            });
        } catch (error) {
          console.error('Camera error:', error);
          barcodeStatus.textContent = 'Camera access was not granted. You can still use the file picker.';
          barcodeFileInput.click();
        }
      });

      const customerNameInput = document.getElementById('customer_name');
      // @ts-ignore - Jinja2 template syntax
      const equipmentToCustomer = {{ equipment_customer_map | tojson | safe }};

      const updateCustomerName = function () {
        const equipmentValue = document.getElementById('equipment').value.trim();
        customerNameInput.value = equipmentToCustomer[equipmentValue] || '';
      };

      document.getElementById('equipment').addEventListener('input', updateCustomerName);
      document.getElementById('equipment').addEventListener('change', updateCustomerName);

      barcodeFileInput.addEventListener('change', function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        scanFromImage(file);
      });
    });
  </script>
{% endblock %}
